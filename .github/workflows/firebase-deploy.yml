name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/project-overview-C2sKn
      - claude/deploy-recent-changes-VdHYN

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting,database --token ${{ secrets.FIREBASE_TOKEN }} --project teamscore-e3094 || true
