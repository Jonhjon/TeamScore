<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隊伍分數顯示畫面</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --score-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .scoreboard-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            width: 100%;
        }

        .team-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .team-card:hover {
            transform: translateY(-5px);
        }

        .team-image-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #eee;
            margin-bottom: 12px;
        }

        .team-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 8px 0;
            text-align: center;
        }

        .score-display {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--score-color);
            margin: 8px 0;
        }


        #conn-dot {
            position: fixed;
            top: 14px;
            right: 16px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
            transition: background 0.5s;
            title: "連線狀態";
        }

    </style>
</head>
<body>
    <div id="conn-dot"></div>
    <h1>🏆 隊伍分數</h1>

    <div class="scoreboard-container">
        <div class="team-card">
            <div class="team-image-container">
                <img src="" alt="Team 1" class="team-image" id="img1">
            </div>
            <div class="team-name" id="name1"></div>
            <div class="score-display" id="score1">0</div>
        </div>

        <div class="team-card">
            <div class="team-image-container">
                <img src="" alt="Team 2" class="team-image" id="img2">
            </div>
            <div class="team-name" id="name2"></div>
            <div class="score-display" id="score2">0</div>
        </div>

        <div class="team-card">
            <div class="team-image-container">
                <img src="" alt="Team 3" class="team-image" id="img3">
            </div>
            <div class="team-name" id="name3"></div>
            <div class="score-display" id="score3">0</div>
        </div>

        <div class="team-card">
            <div class="team-image-container">
                <img src="" alt="Team 4" class="team-image" id="img4">
            </div>
            <div class="team-name" id="name4"></div>
            <div class="score-display" id="score4">0</div>
        </div>

        <div class="team-card">
            <div class="team-image-container">
                <img src="" alt="Team 5" class="team-image" id="img5">
            </div>
            <div class="team-name" id="name5"></div>
            <div class="score-display" id="score5">0</div>
        </div>
    </div>


    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.database();

        function render(teams) {
            teams.forEach((team, i) => {
                const img   = document.getElementById('img'   + (i + 1));
                const name  = document.getElementById('name'  + (i + 1));
                const score = document.getElementById('score' + (i + 1));
                if (img)   img.src           = team.imageUrl || '';
                if (name)  name.textContent  = team.name     || '';
                if (score) score.textContent = team.score    ?? 0;
            });
        }

        db.ref('teams').on('value', (snapshot) => {
            const obj = snapshot.val();
            if (!obj) return;
            const arr = Object.keys(obj)
                .sort((a, b) => Number(a) - Number(b))
                .map(k => obj[k]);
            render(arr);
        });

        db.ref('.info/connected').on('value', (snap) => {
            document.getElementById('conn-dot').style.background = snap.val() ? '#27ae60' : '#e74c3c';
        });
    </script>
</body>
</html>
